name: Build Android Launcher

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: (Optional) Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle wrapper
      shell: bash -l {0}
      run: |
        set -euo pipefail
        # Ensure the wrapper is executable and use it to build the APK.
        chmod +x ./gradlew || true
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WaveLauncher-APK
        path: app/build/outputs/apk/debug/*.apk
